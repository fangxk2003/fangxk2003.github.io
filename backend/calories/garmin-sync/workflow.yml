# Deploy this workflow to the PRIVATE calories-garmin-sync repository only.
name: Garmin calorie sync
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: calories-garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Sync recent daily totals
        env:
          GARMIN_SYNC_ENDPOINT: ${{ vars.GARMIN_SYNC_ENDPOINT }}
          GARMIN_SYNC_CREDENTIAL: ${{ secrets.GARMIN_SYNC_CREDENTIAL }}
          GARMIN_TIMEZONE: Europe/Stockholm
        run: python worker.py sync --days 8
